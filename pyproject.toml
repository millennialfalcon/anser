[project]
name = "anser"
version = "0.1.0"
description = "Asterism Scorer"
readme = "README.md"
authors = [
    { name = "millennialfalcon", email = "73263144+millennialfalcon@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.3",
    "astroquery>=0.4.11",
    "duckdb>=2.0.1",
    "pyarrow>=26.0.1",
]
license = "MIT"
license-files = ["LICENSE"] 

[project.scripts]
anser = "anser:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
